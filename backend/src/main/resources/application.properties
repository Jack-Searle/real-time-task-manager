spring.application.name=backend
spring.config.import=optional:file:../variables.env[.properties],optional:file:variables.env[.properties]
server.port=${PORT:8080}
server.forward-headers-strategy=native

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagerdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.mail.from=${RESEND_FROM:onboarding@resend.dev}
resend.api-key=${RESEND_API_KEY:}
